name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la imagen (default: v9.5.0-hlg)"
        required: false
        default: "v9.5.0-hlg"
  push:
    tags:
      - "v*"
    branches-ignore:
      - "*"

# Fusion de upstream/main (a8351fb) con los 3 commits de CI propios del fork:
#   - se publica solo en GHCR (sin Docker Hub: no tenemos sus secrets)
#   - la imagen va en minusculas (GHCR exige minusculas en el nombre de repo)
#   - se elimina arm/v7 del matrix: era lento y Dokploy no lo necesita
#   - se agrega input de tag para construir a mano sin crear un tag
# Las versiones de actions quedan en las que usa upstream (v7/v4), no en las
# del fork, para no perder fixes de seguridad de los runners.
env:
  IMAGE_BASE: ghcr.io/hlgcodes/go-whatsapp-web-multidevice
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd
            runs-on: ubuntu-latest
            qemu_platforms: ""
          - platform: linux/arm64
            suffix: arm
            runs-on: ubuntu-24.04-arm
            qemu_platforms: ""
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        if: matrix.qemu_platforms != ''
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu_platforms }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./docker/golang.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE_BASE }}:${{ env.TAG }}-${{ matrix.suffix }}

  merge-manifest:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create Versioned Manifest (${{ env.TAG }})
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_BASE }}:${{ env.TAG }} \
            ${{ env.IMAGE_BASE }}:${{ env.TAG }}-amd \
            ${{ env.IMAGE_BASE }}:${{ env.TAG }}-arm
      - name: Create Latest Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_BASE }}:latest \
            ${{ env.IMAGE_BASE }}:${{ env.TAG }}
